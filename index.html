<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic the Comic Collection</title>

    <!-- Google Fonts & Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
      /* --- CSS Variables for Light/Dark Mode --- */
      :root {
        --bg-main: #f8f9fa;
        --bg-surface: #ffffff;
        --text-main: #202124;
        --text-muted: #5f6368;
        --border-color: #dadce0;
        --primary-color: #1a73e8;
        --primary-bg: #e8f0fe;
        --shadow-elevation:
          0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
        --shadow-hover:
          0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
        --success-color: #1ea362;
        --danger-color: #d93025;
        --modal-overlay: rgba(0, 0, 0, 0.5);
      }

      [data-theme="dark"] {
        --bg-main: #121212;
        --bg-surface: #1e1e1e;
        --text-main: #e8eaed;
        --text-muted: #9aa0a6;
        --border-color: #3c4043;
        --primary-color: #8ab4f8;
        --primary-bg: #303134;
        --shadow-elevation: 0 1px 3px rgba(0, 0, 0, 0.5);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.7);
        --success-color: #34a853;
        --danger-color: #ea4335;
        --modal-overlay: rgba(0, 0, 0, 0.7);
      }

      body {
        font-family: "Roboto", sans-serif;
        background-color: var(--bg-main);
        margin: 0;
        padding: 0 12px 40px 12px; /* Reduced side padding for mobile */
        color: var(--text-main);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      /* --- Navigation & Header --- */
      .top-nav {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .icon-btn {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: var(--shadow-elevation);
      }
      .icon-btn:hover {
        background: var(--primary-bg);
        color: var(--primary-color);
      }

      .header {
        text-align: center;
        margin-bottom: 24px;
      }
      .header h1 {
        font-size: 2rem;
        margin: 0 0 8px 0;
        font-weight: 700;
      }
      .header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 1rem;
      }

      .sync-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        background: var(--primary-bg);
        color: var(--primary-color);
        padding: 4px 12px;
        border-radius: 12px;
        margin-top: 12px;
        font-weight: 500;
      }
      .sync-status.offline {
        background: #fce8e6;
        color: var(--danger-color);
      }

      /* --- Bento Dashboard --- */
      .bento-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        max-width: 1200px;
        margin: 0 auto 32px auto;
      }
      .bento-card {
        background: var(--bg-surface);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow-elevation);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .bento-title {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin: 0 0 8px 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bento-value {
        font-size: 2.2rem;
        font-weight: 700;
        margin: 0;
        color: var(--text-main);
      }

      .chart-row {
        margin-bottom: 12px;
      }
      .chart-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .chart-label.owned {
        color: var(--success-color);
      }
      .chart-label.missing {
        color: var(--danger-color);
      }
      .chart-track {
        height: 8px;
        background: var(--border-color);
        border-radius: 4px;
        overflow: hidden;
      }
      .chart-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.8s ease-in-out;
        width: 0%;
      }
      .chart-fill.owned {
        background: var(--success-color);
      }
      .chart-fill.missing {
        background: var(--danger-color);
      }

      /* --- Sticky Toolbar --- */
      .sticky-toolbar {
        position: sticky;
        top: 0;
        background-color: var(--bg-main);
        z-index: 100;
        padding: 12px 0;
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
        border-bottom: 1px solid var(--border-color);
      }
      @media (min-width: 768px) {
        .sticky-toolbar {
          flex-direction: row;
          justify-content: space-between;
        }
      }

      .filter-group {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .control-group {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      @media (min-width: 768px) {
        .control-group {
          width: auto;
        }
      }

      .filter-btn {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      .filter-btn.active {
        background-color: var(--primary-bg);
        color: var(--primary-color);
        border-color: var(--primary-color);
      }

      .search-input,
      .sort-select {
        flex-grow: 1;
        padding: 8px 12px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        background: var(--bg-surface);
        color: var(--text-main);
        font-size: 0.9rem;
        outline: none;
      }

      /* --- UPDATED Gallery Grid (2x2 Mobile, 5x5 Desktop) --- */
      .grid-container {
        display: grid;
        gap: 12px;
        max-width: 1200px;
        margin: 0 auto;
        grid-template-columns: repeat(2, 1fr); /* 2 per row by default */
      }

      @media (min-width: 1024px) {
        .grid-container {
          grid-template-columns: repeat(5, 1fr); /* 5 per row on desktop */
          gap: 20px;
        }
      }

      .card {
        background: var(--bg-surface);
        border-radius: 12px;
        box-shadow: var(--shadow-elevation);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease;
        cursor: pointer;
        position: relative;
      }
      .card:hover {
        transform: translateY(-4px);
      }

      .card-image {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        background-color: var(--border-color);
        border-bottom: 1px solid var(--border-color);
        opacity: 0;
        transition:
          filter 0.3s ease,
          opacity 0.5s ease-in-out;
      }
      .card-image.loaded {
        opacity: 1;
      }
      .img-missing {
        filter: grayscale(100%);
      }
      .card-image.img-missing.loaded {
        opacity: 0.5;
      }

      .card-content {
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .text-info {
        text-align: left;
      }
      .issue-number {
        font-size: 1rem;
        font-weight: 700;
        margin: 0 0 2px 0;
        color: var(--text-main);
      }
      .issue-date {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin: 0;
      }

      .status-toggle-btn {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        border-radius: 50%;
      }
      .material-symbols-rounded {
        font-size: 28px;
      }
      .icon-owned {
        color: var(--success-color);
      }
      .icon-missing {
        color: var(--danger-color);
      }

      .condition-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 0.7rem;
        font-weight: bold;
      }

      .empty-message {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--text-muted);
        font-size: 1.1rem;
        padding: 40px;
      }

      /* --- Modal Styling --- */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--modal-overlay);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .modal-box {
        background: var(--bg-surface);
        padding: 24px;
        border-radius: 16px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 24px 38px rgba(0, 0, 0, 0.14);
        transform: translateY(20px);
        transition: transform 0.3s ease;
      }
      .modal-overlay.active .modal-box {
        transform: translateY(0);
      }
      .modal-header {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--text-main);
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .form-input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-main);
        color: var(--text-main);
        font-family: inherit;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 24px;
      }
      .btn-cancel {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-weight: 500;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: 8px;
      }
      .btn-save {
        background: var(--primary-color);
        color: white;
        border: none;
        font-weight: 500;
        cursor: pointer;
        padding: 8px 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="top-nav">
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark Mode">
        <span class="material-symbols-rounded" id="theme-icon">dark_mode</span>
      </button>
    </div>

    <div class="header">
      <h1>Sonic the Comic Collection</h1>
      <p>Interactive Database & Tracker</p>
      <div id="syncIndicator" class="sync-status">
        <span class="material-symbols-rounded" style="font-size: 18px"
          >cloud_sync</span
        >
        Connecting to Firebase...
      </div>
    </div>

    <div class="bento-container">
      <div class="bento-card">
        <h3 class="bento-title">
          <span class="material-symbols-rounded" style="font-size: 18px"
            >library_books</span
          >
          Collection Status
        </h3>
        <p class="bento-value" id="stat-owned">0 / 0</p>
      </div>
      <div class="bento-card">
        <h3 class="bento-title">
          <span class="material-symbols-rounded" style="font-size: 18px"
            >donut_large</span
          >
          Completion
        </h3>
        <p class="bento-value" id="stat-pct">0%</p>
      </div>
      <div class="bento-card" style="justify-content: space-evenly">
        <div class="chart-row">
          <div class="chart-label owned">
            <span>Owned</span><span id="chart-val-owned">0</span>
          </div>
          <div class="chart-track">
            <div class="chart-fill owned" id="chart-fill-owned"></div>
          </div>
        </div>
        <div class="chart-row">
          <div class="chart-label missing">
            <span>Missing</span><span id="chart-val-missing">0</span>
          </div>
          <div class="chart-track">
            <div class="chart-fill missing" id="chart-fill-missing"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="sticky-toolbar">
      <div class="filter-group">
        <button
          class="filter-btn active"
          data-filter="all"
          onclick="setFilter('all')"
        >
          All
        </button>
        <button
          class="filter-btn"
          data-filter="owned"
          onclick="setFilter('owned')"
        >
          Owned
        </button>
        <button
          class="filter-btn"
          data-filter="missing"
          onclick="setFilter('missing')"
        >
          Missing
        </button>
      </div>
      <div class="control-group">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search..."
          oninput="handleSearch()"
        />
        <select id="sortSelect" class="sort-select" onchange="handleSort()">
          <option value="issue-asc">Issue (Low-High)</option>
          <option value="issue-desc">Issue (High-Low)</option>
          <option value="date-asc">Date (Oldest)</option>
          <option value="date-desc">Date (Newest)</option>
        </select>
      </div>
    </div>

    <div class="grid-container" id="collection-grid"></div>

    <div class="modal-overlay" id="editModal">
      <div class="modal-box">
        <div class="modal-header" id="modalTitle">Edit Issue</div>
        <input type="hidden" id="modalIssueId" />
        <div
          class="form-group checkbox-group"
          onclick="document.getElementById('modalOwned').click()"
        >
          <input
            type="checkbox"
            id="modalOwned"
            onclick="event.stopPropagation()"
          />
          <label for="modalOwned">I own this issue</label>
        </div>
        <div class="form-group">
          <label for="modalCondition">Condition (/10)</label>
          <input
            type="number"
            id="modalCondition"
            class="form-input"
            min="0"
            max="10"
          />
        </div>
        <div class="form-group">
          <label for="modalNotes">Notes</label>
          <textarea id="modalNotes" class="form-input" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="saveModal()">Save</button>
        </div>
      </div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyACDtRRsjhg-S0rEtfZ0SuUUh0NyW7uLRY",
        authDomain: "sonictracker-efecb.firebaseapp.com",
        projectId: "sonictracker-efecb",
        storageBucket: "sonictracker-efecb.firebasestorage.app",
        messagingSenderId: "877189918893",
        appId: "1:877189918893:web:e8191636bc07fb47569624",
        measurementId: "G-GY020ZPS9C",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const collectionRef = db.collection("user_comics");

      let allComics = [];
      let currentFilter = "all";
      let currentSearch = "";
      let currentSort = "issue-asc";

      async function initializeApp() {
        initTheme();
        try {
          const response = await fetch("./collection.json");
          const catalogData = await response.json();
          const snapshot = await collectionRef.get();
          const firebaseData = {};
          snapshot.forEach((doc) => {
            firebaseData[doc.id] = doc.data();
          });

          allComics = catalogData.map((comic) => {
            const fbRecord = firebaseData[comic.issue.toString()];
            return {
              ...comic,
              owned: fbRecord ? fbRecord.owned : false,
              condition: fbRecord ? fbRecord.condition : null,
              notes: fbRecord ? fbRecord.notes : null,
            };
          });

          updateSyncStatus("Online", true);
          processAndRender();
        } catch (error) {
          updateSyncStatus("Offline / Error", false);
          document.getElementById("collection-grid").innerHTML =
            `<p class="empty-message">⚠️ Error loading data.</p>`;
        }
      }

      function updateSyncStatus(msg, isOnline) {
        const indicator = document.getElementById("syncIndicator");
        indicator.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px;">${isOnline ? "cloud_done" : "cloud_off"}</span> ${msg}`;
        isOnline
          ? indicator.classList.remove("offline")
          : indicator.classList.add("offline");
      }

      async function saveToFirebase(issueNum, dataObj) {
        try {
          updateSyncStatus("Saving...", true);
          await collectionRef
            .doc(issueNum.toString())
            .set(dataObj, { merge: true });
          updateSyncStatus("Online & Saved", true);
        } catch (error) {
          updateSyncStatus("Error Saving", false);
        }
      }

      function setFilter(filterType) {
        currentFilter = filterType;
        document
          .querySelectorAll(".filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelector(`.filter-btn[data-filter="${filterType}"]`)
          .classList.add("active");
        processAndRender();
      }

      function handleSearch() {
        currentSearch = document
          .getElementById("searchInput")
          .value.toLowerCase();
        processAndRender();
      }
      function handleSort() {
        currentSort = document.getElementById("sortSelect").value;
        processAndRender();
      }

      function processAndRender() {
        let processedData = allComics.filter((comic) => {
          if (currentFilter === "owned" && !comic.owned) return false;
          if (currentFilter === "missing" && comic.owned) return false;
          return true;
        });

        if (currentSearch.trim() !== "") {
          processedData = processedData.filter(
            (comic) =>
              comic.issue.toString().includes(currentSearch) ||
              (comic.notes &&
                comic.notes.toLowerCase().includes(currentSearch)),
          );
        }

        processedData.sort((a, b) => {
          if (currentSort === "issue-asc") return a.issue - b.issue;
          if (currentSort === "issue-desc") return b.issue - a.issue;
          const dateA = new Date(a.date === "Date TBD" ? "1900-01-01" : a.date);
          const dateB = new Date(b.date === "Date TBD" ? "1900-01-01" : b.date);
          return currentSort === "date-asc" ? dateA - dateB : dateB - dateA;
        });

        updateDashboard();
        renderGrid(processedData);
      }

      function updateDashboard() {
        if (!allComics.length) return;
        const total = allComics.length;
        const owned = allComics.filter((c) => c.owned).length;
        const missing = total - owned;
        const pct = ((owned / total) * 100).toFixed(1);

        document.getElementById("stat-owned").innerText = `${owned} / ${total}`;
        document.getElementById("stat-pct").innerText = `${pct}%`;
        document.getElementById("chart-val-owned").innerText = owned;
        document.getElementById("chart-val-missing").innerText = missing;
        setTimeout(() => {
          document.getElementById("chart-fill-owned").style.width =
            `${(owned / total) * 100}%`;
          document.getElementById("chart-fill-missing").style.width =
            `${(missing / total) * 100}%`;
        }, 50);
      }

      function renderGrid(comicsArray) {
        const grid = document.getElementById("collection-grid");
        if (!comicsArray.length) {
          grid.innerHTML = '<p class="empty-message">No issues found.</p>';
          return;
        }

        grid.innerHTML = comicsArray
          .map((comic) => {
            const isOwned = comic.owned;
            return `
            <div class="card" onclick="openModal(${comic.issue})">
                ${isOwned && comic.condition ? `<div class="condition-badge">${comic.condition}/10</div>` : ""}
                <img data-src="${comic.coverUrl}" alt="Issue ${comic.issue}" class="card-image ${isOwned ? "" : "img-missing"}">
                <div class="card-content">
                    <div class="text-info">
                        <h2 class="issue-number">#${comic.issue}</h2>
                        <p class="issue-date">${comic.date}</p>
                    </div>
                    <button class="status-toggle-btn" onclick="quickToggle(${comic.issue}, event)">
                        <span class="material-symbols-rounded ${isOwned ? "icon-owned" : "icon-missing"}">${isOwned ? "check_circle" : "cancel"}</span>
                    </button>
                </div>
            </div>`;
          })
          .join("");
        initLazyLoading();
      }

      function initLazyLoading() {
        const imageObserver = new IntersectionObserver(
          (entries, observer) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.onload = () => img.classList.add("loaded");
                observer.unobserve(img);
              }
            });
          },
          { rootMargin: "0px 0px 200px 0px" },
        );
        document
          .querySelectorAll(".card-image")
          .forEach((img) => imageObserver.observe(img));
      }

      function quickToggle(issueNum, event) {
        event.stopPropagation();
        const comic = allComics.find((c) => c.issue === issueNum);
        if (comic) {
          comic.owned = !comic.owned;
          saveToFirebase(comic.issue, {
            owned: comic.owned,
            condition: comic.condition || null,
            notes: comic.notes || null,
          });
          processAndRender();
        }
      }

      function openModal(issueNum) {
        const comic = allComics.find((c) => c.issue === issueNum);
        if (!comic) return;
        document.getElementById("modalTitle").innerText =
          `Issue #${comic.issue}`;
        document.getElementById("modalIssueId").value = comic.issue;
        document.getElementById("modalOwned").checked = comic.owned;
        document.getElementById("modalCondition").value = comic.condition || "";
        document.getElementById("modalNotes").value = comic.notes || "";
        document.getElementById("editModal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("editModal").classList.remove("active");
      }

      function saveModal() {
        const issueNum = parseInt(
          document.getElementById("modalIssueId").value,
        );
        const comic = allComics.find((c) => c.issue === issueNum);
        if (comic) {
          comic.owned = document.getElementById("modalOwned").checked;
          comic.condition = document.getElementById("modalCondition").value;
          comic.notes = document.getElementById("modalNotes").value;
          saveToFirebase(comic.issue, {
            owned: comic.owned,
            condition: comic.condition,
            notes: comic.notes,
          });
          processAndRender();
          closeModal();
        }
      }

      document
        .getElementById("editModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });

      // --- Dark Theme (System Default + Manual Override) ---
      function initTheme() {
        const savedTheme = localStorage.getItem("stc_theme");
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;

        // If user explicitly saved a preference, use it. Otherwise, use system preference.
        if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.getElementById("theme-icon").innerText = "light_mode";
        } else {
          document.documentElement.removeAttribute("data-theme");
          document.getElementById("theme-icon").innerText = "dark_mode";
        }
      }

      function toggleTheme() {
        const root = document.documentElement;
        const icon = document.getElementById("theme-icon");
        const isDark = root.getAttribute("data-theme") === "dark";

        if (isDark) {
          root.removeAttribute("data-theme");
          localStorage.setItem("stc_theme", "light");
          icon.innerText = "dark_mode";
        } else {
          root.setAttribute("data-theme", "dark");
          localStorage.setItem("stc_theme", "dark");
          icon.innerText = "light_mode";
        }
      }

      initializeApp();
    </script>
  </body>
</html>
